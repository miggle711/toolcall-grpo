# Supervised baseline for the GRPO runs: LoRA on the gold tool calls, same model, same LoRA settings and
# the same training examples as grpo_hint (train_fit.jsonl, validation split excluded). Judge it on val
# first and look at the test set once at the end. No hint in the prompts, so the model sees the gold
# calls as they are; evaluate it with and without the hint.
model: Qwen/Qwen2.5-1.5B-Instruct
train_file: train_fit.jsonl
train_hint: false

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

sft:
  num_train_epochs: 2  # 768 examples, 2 passes
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 2  # 8 examples per step, 192 steps
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_steps: 10
  max_length: 2400
  completion_only_loss: true
  bf16: true
  gradient_checkpointing: true
  save_steps: 50
  save_total_limit: 4
  logging_steps: 5
  report_to: tensorboard
  seed: 0
