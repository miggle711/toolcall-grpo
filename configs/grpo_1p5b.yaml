# First real run. The values are starting points to tune after the smoke test and the baseline,
# not recommendations. Memory use on a 48 GB A40 is an estimate until it has been run.
model: Qwen/Qwen2.5-1.5B-Instruct
print_completions: false  # keep the console log small, the completions are still saved

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

grpo:
  # rewards: [format_reward, call_reward]
  reward_weights: [0.1, 0.9]
  num_generations: 8
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4  # generation batch of 16 = 2 prompts x 8 completions per step
  max_completion_length: 640
  learning_rate: 2.0e-5
  beta: 0.0
  temperature: 1.0
  max_steps: 400
  save_steps: 50
  save_total_limit: 3
  logging_steps: 1
  bf16: true
  gradient_checkpointing: true
  use_vllm: true
  vllm_mode: colocate
  vllm_gpu_memory_utilization: 0.3
  vllm_max_model_length: 2304  # longest prompt is 1457 tokens, plus 640 of completion
  log_completions: true  # saved as parquet files in the output directory
  report_to: tensorboard
  seed: 0
