# A few steps on the 0.5B model, to check that everything runs: reward logged, memory fits,
# checkpoints written. The numbers it produces mean nothing.
model: Qwen/Qwen2.5-0.5B-Instruct
max_train_examples: 32

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

grpo:
  # rewards: [format_reward, call_reward]
  reward_weights: [0.1, 0.9]
  num_generations: 4
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 1
  max_completion_length: 256
  learning_rate: 1.0e-5
  beta: 0.0
  temperature: 1.0
  max_steps: 10
  save_steps: 5
  save_total_limit: 2
  logging_steps: 1
  bf16: true
  gradient_checkpointing: true
  use_vllm: true
  vllm_mode: colocate
  vllm_gpu_memory_utilization: 0.3
  vllm_max_model_length: 2048
  log_completions: true
  num_completions_to_print: 2
  report_to: tensorboard
  seed: 0
